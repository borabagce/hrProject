name: ik_analiz_mobile
description: İK Analiz — Çalışan mobil uygulaması.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  go_router: ^14.2.0

  dio: ^5.5.0
  retrofit: ">=4.4.0 <4.9.0"
  pretty_dio_logger: ^1.4.0

  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  flutter_secure_storage: ^9.2.2

  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  connectivity_plus: ^6.0.5
  web_socket_channel: ^3.0.0
  flutter_local_notifications: ^17.2.2
  intl: ^0.20.2
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.11
  riverpod_generator: ^2.4.2
  retrofit_generator: ^9.7.0
  freezed: ^2.4.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
